[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "djev-dev"
version = "0.1.0"
description = "Local typed decisions with native DiffusionGemma structured reads"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "Pillow==12.3.0",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
tokenizer = ["transformers==5.17.0", "sentencepiece>=0.2,<1", "jinja2>=3.1,<4"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
djev = "djev.__main__:main"

[tool.setuptools.packages.find]
include = ["djev*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
