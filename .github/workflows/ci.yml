name: Validate OpenJeff
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  saved-score-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test numerical core (optional model-library tests may skip)
        run: python -m unittest discover -s tests -v
      - name: Validate original pilot records and adapter
        run: python -m scripts.validate_release
      - name: Validate diffusion study records
        run: python -m scripts.validate_hybrid_v2
